:root{
  --paper:#faf6f3;--paper-2:#f1eae5;--card:#fffdfc;--ink:#1e1614;--muted:#6e625d;--rule:#e3d9d2;
  --red:#d71f26;--red-deep:#a9151b;--on-red:#fffaf8;--ok:#1f7a4d;--danger:#b3261e;
  --wasser:#1f6fb2;--kraft:#d71f26;--sonstiges:#b77a00;--turnier:#1e1614;
  --accent:var(--red);--line:var(--rule);--text:var(--ink);--surface:var(--card);--surface2:var(--paper-2);--bg:var(--paper);
  --display:"Barlow Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r-card:16px;--r-ctl:12px;--r-in:8px;
  --ease-out:cubic-bezier(.2,.8,.2,1);--ease-in:cubic-bezier(.5,0,.9,.4);--micro:120ms;--short:220ms;--long:420ms;
  --lift:0 6px 18px rgba(60,20,16,.16);
}
:root[data-theme="dark"]{
  --paper:#171210;--paper-2:#221a17;--card:#1e1714;--ink:#f5ede8;--muted:#ab9d95;--rule:#3b2f2a;
  --red:#ee3d44;--red-deep:#c9262d;--on-red:#fffaf8;--ok:#4cc38a;--danger:#ff7b72;
  --wasser:#5aa9e6;--kraft:#ee3d44;--sonstiges:#e0a526;--turnier:#f5ede8;
  --lift:0 6px 18px rgba(0,0,0,.5);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 var(--body);overflow-x:clip}
body{min-height:100vh}
::selection{background:var(--red);color:var(--on-red)}
h1,h2,h3{margin:0;font-family:var(--display);font-weight:700;line-height:1.05;letter-spacing:-.005em}
h1{font-size:2.3rem}
h2{font-size:1.45rem}
h3{font-size:1.15rem}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--rule);border-radius:var(--r-ctl);padding:.65rem .8rem;width:100%;min-width:0;transition:border-color var(--micro) var(--ease-out)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--red);outline-offset:-1px;border-color:var(--red)}
textarea{resize:vertical;min-height:5.5rem;line-height:1.5}
input[type=date],input[type=time]{padding-left:.55rem;padding-right:.3rem;font-size:.88rem;min-height:2.85rem}
label{display:block;font-size:.8rem;color:var(--muted);margin:0 0 .3rem .1rem}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.sm{width:17px;height:17px}
.num,.big,.kpi b,.score,.stepper b,.rpe button,.cal button{font-variant-numeric:tabular-nums}

/* Layout */
#side{display:none}
#top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:.5rem;height:60px;padding:0 16px;background:var(--paper);border-bottom:1px solid var(--rule)}
.brand{display:flex;align-items:center;gap:.6rem;font-family:var(--display);font-weight:700;font-size:1.5rem;line-height:1}
.brand small{display:block;font:500 .68rem/1.2 var(--body);color:var(--muted)}
.crest{width:30px;height:36px;flex:none;color:var(--red)}
#top .sp{flex:1}
#view{padding:16px 16px 120px;max-width:720px;margin:0 auto}
#view.enter>*{animation:rise var(--long) var(--ease-out) both}
#view.enter>*:nth-child(2){animation-delay:40ms}#view.enter>*:nth-child(3){animation-delay:80ms}#view.enter>*:nth-child(4){animation-delay:120ms}#view.enter>*:nth-child(n+5){animation-delay:160ms}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:1fr 1fr 76px 1fr 1fr;align-items:end;background:var(--card);border-top:1px solid var(--rule);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
#tabs a.nav,#side a.nav{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;color:var(--muted);padding:6px 2px 4px;border-radius:var(--r-ctl);transition:color var(--micro) var(--ease-out)}
#tabs a.nav.on,#side a.nav.on{color:var(--red)}
#tabs a.nav.on .ic{stroke-width:2.4}
.go{justify-self:center;width:62px;height:62px;margin-top:-26px;border-radius:50%;background:var(--red);color:var(--on-red);display:grid;place-items:center;box-shadow:var(--lift);border:4px solid var(--paper);transition:transform var(--micro) var(--ease-out)}
.go svg{width:34px;height:34px;transition:transform var(--long) var(--ease-out)}
.go:active{transform:scale(.94)}.go:active svg{transform:rotate(60deg)}
.go span{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
@media(min-width:900px){
  #tabs{display:none}
  #side{display:flex;flex-direction:column;gap:2px;position:fixed;left:0;top:0;bottom:0;width:232px;padding:20px 14px;border-right:1px solid var(--rule);background:var(--card)}
  #side .brand{padding:2px 8px 22px}
  #side a.nav{flex-direction:row;gap:.75rem;font-size:.95rem;padding:.65rem .8rem}
  #side a.nav.on{background:var(--paper-2)}
  #side .btn{margin:14px 0 10px}
  #top{margin-left:232px}#top .brand{display:none}
  #view{margin-left:232px;max-width:none;padding:28px 40px 60px}
  #view>*{max-width:820px}
}

/* Bausteine */
.card{background:var(--card);border:1px solid var(--rule);border-radius:var(--r-card);padding:16px}
.card+.card,.stack>*+*{margin-top:12px}
.row{display:flex;align-items:center;gap:.6rem}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.grid{display:grid;gap:10px}.grid>*{min-width:0}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.g3d{grid-template-columns:1.45fr 1fr .8fr}
@media(max-width:520px){.g4{grid-template-columns:1fr 1fr}}
.muted{color:var(--muted)}.small{font-size:.86rem}.tiny{font-size:.76rem}
.right{text-align:right}.center{text-align:center}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:28px 0 10px}
.sec h2{font-size:1.45rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:44px;padding:.55rem 1rem;border-radius:var(--r-ctl);background:transparent;border:1.5px solid var(--ink);font-weight:600;font-size:.95rem;white-space:nowrap;transition:transform var(--micro) var(--ease-out),background-color var(--micro) var(--ease-out)}
.btn:hover{background:var(--paper-2)}
.btn.pri{background:var(--red);color:var(--on-red);border-color:var(--red)}
.btn.pri:hover{background:var(--red-deep);border-color:var(--red-deep)}
.btn.ghost{border-color:transparent}
.btn.danger{color:var(--danger);border-color:transparent}
.btn.block{display:flex;width:100%}
.btn.sm{min-height:36px;padding:.3rem .7rem;font-size:.84rem;border-width:1px;border-color:var(--rule);border-radius:10px}
.btn.lg{min-height:56px;font-family:var(--display);font-size:1.45rem;letter-spacing:.01em}
.btn:active{transform:scale(.97)}
.iconbtn{width:42px;height:42px;border-radius:var(--r-ctl);display:grid;place-items:center;border:1px solid var(--rule);background:var(--card);flex:none;transition:transform var(--micro) var(--ease-out),background-color var(--micro) var(--ease-out)}
.iconbtn:hover{background:var(--paper-2)}.iconbtn:active{transform:scale(.94)}
.iconbtn.sm{width:32px;height:32px;border-radius:9px}
.iconbtn.plain{border-color:transparent;background:none}
.chip{display:inline-flex;align-items:center;gap:.35rem;min-height:36px;padding:.3rem .85rem;border-radius:999px;border:1px solid var(--rule);background:var(--card);font-size:.86rem;white-space:nowrap;transition:background-color var(--micro) var(--ease-out),color var(--micro) var(--ease-out)}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.badge{display:inline-flex;align-items:center;gap:.3rem;font-size:.76rem;font-weight:600;padding:.15rem .5rem;border-radius:6px;color:var(--c,var(--ink));border:1px solid currentColor;white-space:nowrap}
.t-wasser{--c:var(--wasser)}.t-kraft{--c:var(--kraft)}.t-sonstiges{--c:var(--sonstiges)}.t-turnier{--c:var(--turnier)}
.seg{display:flex;background:var(--paper-2);border-radius:var(--r-ctl);padding:4px;gap:2px}
.seg button,.seg a{flex:1;text-align:center;min-height:38px;padding:.4rem .4rem;border-radius:var(--r-in);font-size:.88rem;color:var(--muted);transition:background-color var(--short) var(--ease-out),color var(--short) var(--ease-out)}
.seg .on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 0 0 1px var(--rule)}
.item{display:flex;align-items:center;gap:.8rem;padding:13px 14px 13px 16px;background:var(--card);border:1px solid var(--rule);border-radius:var(--r-card);position:relative;overflow:hidden;transition:transform var(--micro) var(--ease-out)}
.item::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c,var(--rule))}
.item:active{transform:scale(.985)}
.item+.item{margin-top:8px}
.item .ttl{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item.done .ttl{color:var(--muted)}
.tick{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--ok);color:#fff;flex:none}
.tick .ic{width:14px;height:14px;stroke-width:3}
.empty{color:var(--muted);padding:22px 16px;border:1px dashed var(--rule);border-radius:var(--r-card)}
.kpi{border-top:2px solid var(--ink);padding:10px 2px 4px}
.kpi b{display:block;font-family:var(--display);font-size:2.2rem;line-height:1}
.kpi b small{font-size:1.1rem}
.kpi span{font-size:.8rem;color:var(--muted)}
.fab{position:fixed;right:18px;bottom:calc(96px + env(safe-area-inset-bottom));z-index:25;width:54px;height:54px;border-radius:var(--r-card);background:var(--ink);color:var(--paper);display:grid;place-items:center;box-shadow:var(--lift);transition:transform var(--micro) var(--ease-out)}
.fab:active{transform:scale(.93)}
@media(min-width:900px){.fab{bottom:28px;right:28px}}
.progress{height:6px;border-radius:99px;background:var(--paper-2);overflow:hidden}
.progress i{display:block;height:100%;width:100%;background:var(--red);transform-origin:left;transform:scaleX(var(--p,0));transition:transform var(--long) var(--ease-out)}

/* Startseite */
.hero{position:relative;overflow:hidden;border-radius:22px;padding:20px 20px 18px;background:var(--red);color:var(--on-red)}
.hero .wheel{position:absolute;right:-70px;top:-50px;width:250px;height:250px;opacity:.16;pointer-events:none;animation:turn 60s linear infinite}
@keyframes turn{to{transform:rotate(360deg)}}
.hero h1{font-size:3rem;margin:.1rem 0 1rem;position:relative}
.hero .btn{background:var(--on-red);color:var(--red-deep);border-color:var(--on-red);position:relative}
.hero .facts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px;padding-top:14px;border-top:1px solid rgba(255,255,255,.35);position:relative}
.hero .facts b{display:block;font-family:var(--display);font-size:2rem;line-height:1}
.hero .facts span{font-size:.78rem;opacity:.9}
.tiles{display:grid;gap:8px}
.tile{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px;border:1px solid var(--rule);border-radius:var(--r-card);background:var(--card);transition:transform var(--micro) var(--ease-out),border-color var(--micro) var(--ease-out)}
.tile:hover{border-color:var(--ink)}.tile:active{transform:scale(.98)}
.tile .ico{width:46px;height:46px;border-radius:var(--r-ctl);display:grid;place-items:center;background:var(--paper-2);color:var(--c,var(--ink));flex:none}
.tile.pri{background:var(--red);border-color:var(--red);color:var(--on-red)}
.tile.pri .ico{background:rgba(255,255,255,.2);color:var(--on-red)}
.tile.pri .muted{color:inherit;opacity:.9}
.tile b{display:block;font-family:var(--display);font-size:1.3rem;line-height:1.1}

/* Anstrengung */
.rpe{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.rpe button{aspect-ratio:1;border-radius:10px;border:1px solid var(--rule);font-weight:600;background:color-mix(in srgb,var(--red) calc(var(--i)*7%),var(--card));transition:transform var(--micro) var(--ease-out)}
.rpe button.on{background:var(--red);color:var(--on-red);border-color:var(--red);transform:scale(1.12)}

/* Kalender */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wd{font-size:.74rem;color:var(--muted);text-align:center;padding:2px 0}
.cal button{aspect-ratio:1/1;min-height:42px;border-radius:var(--r-ctl);background:var(--card);border:1px solid var(--rule);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.9rem;transition:transform var(--micro) var(--ease-out)}
.cal button:active{transform:scale(.92)}
.cal button.out{opacity:.35}
.cal button.today{border-color:var(--red);color:var(--red);font-weight:700}
.cal button.sel{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.dots{display:flex;gap:2px;height:6px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--c)}
.cal button.sel .dots i{background:var(--paper)}

/* Krafttraining */
.blockhd{font-family:var(--display);font-weight:700;font-size:1.15rem;color:var(--red);margin:18px 2px 8px}
.ex{background:var(--card);border:1px solid var(--rule);border-radius:var(--r-card);padding:14px 12px 12px}
.ex+.ex{margin-top:10px}
.ex.done{border-color:var(--ok)}
.ex .num{width:28px;height:28px;border-radius:var(--r-in);background:var(--ink);color:var(--paper);display:grid;place-items:center;font-size:.84rem;font-weight:700;flex:none}
.ex.done .num{background:var(--ok);color:#fff}
.hint{font-size:.86rem;margin-top:8px;padding-left:10px;border-left:3px solid var(--red)}
.set{display:grid;grid-template-columns:24px 1fr 1fr 52px;gap:6px;align-items:center;margin-top:6px}
.set.one{grid-template-columns:24px 1fr 52px}
.set .n{font-size:.84rem;color:var(--muted);text-align:center}
.set input{text-align:center;padding:.6rem .3rem;font-weight:700;font-size:1.05rem;background:var(--paper)}
.set .unit{position:relative}
.set .unit span{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-size:.72rem;color:var(--muted);pointer-events:none}
.chk{height:46px;border-radius:var(--r-ctl);border:1.5px solid var(--ink);display:grid;place-items:center;color:var(--ink);transition:transform var(--micro) var(--ease-out),background-color var(--micro) var(--ease-out)}
.chk:active{transform:scale(.9)}
.chk.on{background:var(--ok);color:#fff;border-color:var(--ok);animation:pop var(--short) var(--ease-out)}
@keyframes pop{from{transform:scale(.8)}}
.planrow{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.planrow input,.planrow select{padding:.5rem .4rem;text-align:center}
#rest{position:fixed;left:50%;transform:translate(-50%,140%);bottom:calc(100px + env(safe-area-inset-bottom));z-index:40;background:var(--ink);color:var(--paper);border-radius:999px;padding:.5rem .6rem .5rem 1.2rem;display:flex;align-items:center;gap:.7rem;box-shadow:var(--lift);font-family:var(--display);font-size:1.5rem;font-variant-numeric:tabular-nums;transition:transform var(--short) var(--ease-in),opacity var(--short) var(--ease-in),visibility 0s var(--short);white-space:nowrap;opacity:0;visibility:hidden;pointer-events:none}
#rest.on{transform:translate(-50%,0);opacity:1;visibility:visible;pointer-events:auto;transition:transform var(--short) var(--ease-out),opacity var(--short) var(--ease-out)}
#rest button{border:1px solid currentColor;border-radius:99px;min-height:36px;padding:0 .8rem;font:600 .82rem var(--body);color:inherit}

/* Zähler / Turniere */
.stepper{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--rule);border-radius:var(--r-ctl);padding:3px;background:var(--card)}
.stepper button{width:42px;height:42px;border-radius:9px;background:var(--paper-2);font-size:1.3rem;font-weight:700;line-height:1;transition:transform var(--micro) var(--ease-out)}
.stepper button:active{transform:scale(.88)}
.stepper button:last-child{background:var(--ink);color:var(--paper)}
.stepper b{min-width:1.8rem;text-align:center;font-family:var(--display);font-size:1.6rem;line-height:1}
.stepper.xl b{font-size:2.6rem}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
@media(max-width:420px){.stat{grid-template-columns:1fr 1fr}}
.tablewrap{overflow-x:auto;border-top:2px solid var(--ink)}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:.55rem .6rem;text-align:right;border-bottom:1px solid var(--rule);white-space:nowrap}
th{font-weight:400;color:var(--muted);font-size:.8rem}
th:first-child,td:first-child{text-align:left;padding-left:2px}

/* Dialog */
#sheet{position:fixed;inset:0;z-index:60;display:none;align-items:flex-end;justify-content:center;background:rgba(30,22,20,.55)}
#sheet.on{display:flex;animation:fade var(--short) var(--ease-out)}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--paper);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom));animation:up var(--long) var(--ease-out)}
@media(min-width:700px){#sheet{align-items:center}.sheet{border-radius:24px}}
@keyframes up{from{transform:translateY(40px)}}
.sheet .hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sheet .hd h2{font-size:1.8rem}
.field{margin-bottom:10px}
#toast{position:fixed;left:50%;top:12px;transform:translate(-50%,-90px);z-index:90;background:var(--ink);color:var(--paper);padding:.6rem 1.1rem;border-radius:var(--r-ctl);font-size:.92rem;transition:transform var(--short) var(--ease-out);box-shadow:var(--lift);max-width:92vw;text-align:center}
#toast.on{transform:translate(-50%,0)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:10px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--c);margin-right:5px}
details>summary{cursor:pointer;list-style:none}
details>summary::-webkit-details-marker{display:none}
details>summary .badge::after{content:"+";margin-left:.3rem}
details[open]>summary .badge::after{content:"–"}
.pick{display:flex;align-items:center;gap:.6rem;min-height:46px;padding:.5rem .2rem;border-bottom:1px solid var(--rule);width:100%;text-align:left}
.cathd{font-family:var(--display);font-weight:700;font-size:1.1rem;margin:16px 0 2px}

/* Intervall-Timer */
.step{display:grid;grid-template-columns:1fr 74px 74px 32px;gap:6px;align-items:end;padding:8px 0;border-bottom:1px solid var(--rule)}
.step input{padding:.5rem .5rem}.step input[data-num]{text-align:center;font-weight:700}
#run{position:fixed;inset:0;z-index:80;display:none;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(18px + env(safe-area-inset-top)) 20px calc(26px + env(safe-area-inset-bottom));background:var(--paper);color:var(--ink);text-align:center;transition:background-color var(--short) var(--ease-out),color var(--short) var(--ease-out)}
#run.on{display:flex}
#run.work{background:var(--red);color:var(--on-red)}
#run.prep{background:var(--ink);color:var(--paper)}
#run .top{width:100%;display:flex;justify-content:space-between;align-items:center;font-size:.95rem}
#run .phase{font-family:var(--display);font-weight:700;font-size:2rem;line-height:1.05;max-width:22ch}
#run .dial{position:relative;width:min(78vw,46vh,420px);aspect-ratio:1;display:grid;place-items:center}
#run .dial svg{position:absolute;inset:0;width:100%;height:100%;opacity:.14;transition:transform .25s linear}
#run .time{position:relative;font-family:var(--display);font-weight:700;font-size:clamp(6rem,36vw,13rem);line-height:.9;font-variant-numeric:tabular-nums}
#run .bar{width:100%;max-width:520px;height:8px;border-radius:99px;background:color-mix(in srgb,currentColor 22%,transparent);overflow:hidden}
#run .bar i{display:block;height:100%;background:currentColor;transform-origin:left;transform:scaleX(var(--p,0))}
#run .ctl{display:flex;align-items:center;gap:18px}
#run .ctl button{width:60px;height:60px;border-radius:50%;border:2px solid currentColor;display:grid;place-items:center;transition:transform var(--micro) var(--ease-out)}
#run .ctl button:active{transform:scale(.9)}
#run .ctl button.main{width:88px;height:88px;background:var(--ink);color:var(--paper);border-color:var(--ink)}
#run.prep .ctl button.main{background:var(--red);border-color:var(--red);color:var(--on-red)}
#run .ctl .ic{width:28px;height:28px}
#run .next{min-height:3em;font-size:1rem;opacity:.9}

#print{display:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{
  body>*:not(#print){display:none!important}
  #print{display:block;color:#000;background:#fff;font:11pt/1.4 system-ui,sans-serif;padding:0}
  html,body{background:#fff}
  #print h1{font-size:22pt;margin-bottom:2pt;color:#c4161c}#print h2{font-size:14pt;margin:14pt 0 4pt;border-bottom:1.5pt solid #c4161c;padding-bottom:2pt}
  #print table{font-size:9.5pt;margin-top:4pt}#print th,#print td{border-bottom:.5pt solid #bbb;color:#000;padding:3pt 5pt;white-space:normal}
  #print th{color:#444}#print .meta{color:#444;font-size:10pt}#print p{margin:3pt 0;white-space:pre-wrap}
  #print tr,#print .nb{break-inside:avoid}#print .tablewrap{border:0}
  @page{margin:16mm 14mm}
}

const UI = {month:today().slice(0,7), sel:null, filter:'alle', kraftTab:'plaene', exq:'', range:'12w', statEx:'', openPlayers:{}};
const inp = (path,val,extra='')=>`<input data-bind="${path}" value="${esc(val??'')}" ${extra}>`;
const numinp = (path,val,extra='')=>`<input data-bind="${path}" data-num inputmode="decimal" value="${esc(fnum(val))}" ${extra}>`;

const badge = t=>`<span class="badge t-${t}">${ic(TYPES[t].icon,'sm')}${TYPES[t].short}</span>`;

function entryItem(e){
  const sub=[fdate(e.date)+(e.time?' · '+e.time:'')];
  if(e.minutes) sub.push(e.minutes+' min'); else if(e.planned) sub.push('geplant '+e.planned+' min');
  if(e.rpe) sub.push('RPE '+e.rpe);
  if(e.type==='kraft'&&e.items.length) sub.push(e.items.length+' Übungen');
  return `<a class="item t-${e.type} ${e.done?'done':''}" href="#/training/${e.id}">
    <div class="grow"><div class="ttl">${esc(e.title)}</div><div class="small muted">${sub.join(' · ')}</div></div>
    ${e.done?`<span class="tick">${ic('check')}</span>`:badge(e.type)}</a>`;
}
function tournItem(t){
  const rec=record(t);
  return `<a class="item t-turnier" href="#/turnier/${t.id}"><div class="grow"><div class="ttl">${esc(t.name||'Turnier')}</div>
    <div class="small muted">${fdate(t.from)}${t.to&&t.to!==t.from?' – '+fshort(t.to):''}${t.ort?' · '+esc(t.ort):''}${t.games.length?` · ${t.games.length} Spiele (${rec.w}-${rec.d}-${rec.l})`:''}</div></div>${t.kind==='lehrgang'?`<span class="badge t-turnier">Lehrgang</span>`:badge('turnier')}</a>`;
}
function record(t){ const r={w:0,d:0,l:0,gf:0,ga:0}; for(const g of t.games){ if(g.gf==null||g.ga==null) continue; r.gf+=g.gf; r.ga+=g.ga; g.gf>g.ga?r.w++:g.gf<g.ga?r.l++:r.d++; } return r; }
function guideCard(g,open){
  if(!g) return '';
  const rows=[['kraft','Kraft','kraft'],['trx','TRX','kraft'],['wasser','Boot','wasser'],['sonstiges','Laufen / Rad / Sonstiges','sonstiges']].filter(r=>g[r[0]]);
  return `<div class="card"><div class="row"><div class="grow"><b>${esc(S.settings.trainer)}s Vorgabe · ${esc(g.title)}</b><div class="small muted">${fshort(g.from)} – ${fshort(g.to)}</div></div><a class="btn sm" href="#/kraft" data-a="ktab" data-v="monat">Monatsplan</a></div>
   ${rows.map(r=>`<details ${open?'open':''} style="margin-top:10px"><summary><span class="badge t-${r[2]}">${r[1]}</span></summary><div class="small" style="white-space:pre-wrap;margin-top:6px">${esc(g[r[0]])}</div></details>`).join('')}</div>`;
}

const views = {
/* ---------- Heute ---------- */
heute(){
  const t=today(), ws=weekStart(t), we=addDays(ws,6);
  const week=S.entries.filter(e=>e.date>=ws&&e.date<=we);
  const done=week.filter(e=>e.done);
  const todayE=S.entries.filter(e=>e.date===t);
  const next=S.entries.filter(e=>e.date>t&&!e.done).sort(byDate).slice(0,4);
  const open=S.entries.filter(e=>e.date<t&&!e.done).sort(byDate).slice(-3);
  const nt=S.tournaments.filter(x=>(x.to||x.from)>=t).sort((a,b)=>a.from.localeCompare(b.from))[0];
  const days=nt?Math.round((pdate(nt.from)-pdate(t))/864e5):null;
  const g=guideFor(t);
  return `<section class="hero">${wheelSvg('wheel')}<div class="small">${fdate(t)}</div><h1>Hallo ${esc(S.settings.name||'')}</h1>
    <button class="btn lg block" data-a="start">${ic('play','sm')}Training starten</button>
    <div class="facts"><div><b>${done.length}/${week.length}</b><span>Einheiten diese Woche</span></div>
    <div><b>${hm(sum(done,e=>e.minutes))}</b><span>Trainingszeit</span></div>
    <div><b>${nt?(days<=0?'Jetzt':days):'–'}</b><span>${nt?(days<=0?esc(nt.name):'Tage bis '+esc(nt.name)):'kein Termin geplant'}</span></div></div></section>
   ${todayE.length?`<div class="sec"><h2>Heute</h2></div>${todayE.map(entryItem).join('')}`:''}
   ${g?`<div class="sec"><h2>Diese Woche von ${esc(S.settings.trainer)}</h2></div>${guideCard(g)}`:''}
   ${open.length?`<div class="sec"><h2>Noch offen</h2></div>${open.map(entryItem).join('')}`:''}
   <div class="sec"><h2>Als Nächstes</h2><a class="small muted" href="#/saison">Zur Saison</a></div>
   ${next.length?next.map(entryItem).join(''):`<div class="empty">Noch nichts geplant. Über „Training starten“ legst du los oder planst Einheiten für später.</div>`}
   ${nt?`<div class="sec"><h2>Nächster Termin</h2><a class="small muted" href="#/turniere">Alle Turniere</a></div>${tournItem(nt)}`:''}`;
},
/* ---------- Saison ---------- */
saison(){
  const [y,m]=UI.month.split('-').map(Number);
  const first=new Date(y,m-1,1), start=addDays(iso(first),-((first.getDay()+6)%7));
  const map={};
  for(const e of S.entries){ (map[e.date]=map[e.date]||new Set()).add(e.type); }
  for(const t of S.tournaments){ for(let d=t.from;d<=(t.to||t.from);d=addDays(d,1)) (map[d]=map[d]||new Set()).add('turnier'); }
  let cells='';
  for(let i=0;i<42;i++){ const d=addDays(start,i); if(i>=35&&d.slice(0,7)!==UI.month) break;
    cells+=`<button data-a="selDay" data-d="${d}" class="${d.slice(0,7)!==UI.month?'out':''} ${d===today()?'today':''} ${d===UI.sel?'sel':''}">${+d.slice(8)}<span class="dots">${[...(map[d]||[])].map(t=>`<i class="t-${t}"></i>`).join('')}</span></button>`; }
  const inRange = d => UI.sel ? d===UI.sel : d.slice(0,7)===UI.month;
  let list=S.entries.filter(e=>inRange(e.date)&&(UI.filter==='alle'||UI.filter===e.type)).map(e=>({d:e.date+(e.time||''),h:entryItem(e)}));
  if(UI.filter==='alle'||UI.filter==='turnier') for(const t of S.tournaments){ const hit=UI.sel? (t.from<=UI.sel&&UI.sel<=(t.to||t.from)) : (t.from.slice(0,7)<=UI.month&&UI.month<=(t.to||t.from).slice(0,7)); if(hit) list.push({d:t.from,h:tournItem(t)}); }
  list.sort((a,b)=>a.d.localeCompare(b.d));
  const monthE=S.entries.filter(e=>e.date.slice(0,7)===UI.month);
  return `<div class="row"><button class="iconbtn" data-a="month" data-d="-1">${ic('back')}</button><h1 class="grow center">${MON[m-1]} ${y}</h1><button class="iconbtn" data-a="month" data-d="1" style="transform:scaleX(-1)">${ic('back')}</button></div>
   <div class="small muted center" style="margin:4px 0 12px">${monthE.length} Einheiten · ${fmin(sum(monthE.filter(e=>e.done),e=>e.minutes))} absolviert</div>
   <div class="cal">${['Mo','Di','Mi','Do','Fr','Sa','So'].map(w=>`<div class="wd">${w}</div>`).join('')}${cells}</div>
   <div class="chips scroll" style="margin-top:14px">${['alle','wasser','kraft','sonstiges','turnier'].map(f=>`<button class="chip ${UI.filter===f?'on':''}" data-a="filter" data-v="${f}">${f==='alle'?'Alle':TYPES[f].short}</button>`).join('')}</div>
   <div class="sec"><h2>${UI.sel?fdate(UI.sel):'Im '+MON[m-1]}</h2>${UI.sel?`<button class="small muted" data-a="selDay" data-d="">ganzer Monat</button>`:''}</div>
   ${list.length?list.map(x=>x.h).join(''):`<div class="empty">Keine Einträge. Tippe auf + um ein Training oder Turnier anzulegen.</div>`}
   <button class="fab" data-a="newEntry" aria-label="Neu">${ic('plus')}</button>`;
},

/* ---------- Statistik ---------- */
stats(){
  const t=today(); const from = UI.range==='4w'?addDays(t,-27):UI.range==='12w'?addDays(t,-83):UI.range==='jahr'?t.slice(0,4)+'-01-01':'0000';
  const E=S.entries.filter(e=>e.done&&e.date>=from&&e.date<=t);
  const T=S.tournaments.filter(x=>x.from>=from);
  const games=T.flatMap(x=>x.games);
  const rp=E.filter(e=>e.rpe);
  const mins=sum(E,e=>e.minutes)+sum(games,g=>g.minutes);
  // Wochen
  const nW=UI.range==='4w'?4:12; const weeks=[];
  for(let i=nW-1;i>=0;i--){ const ws=addDays(weekStart(t),-7*i), we=addDays(ws,6); const w={label:fshort(ws),wasser:0,kraft:0,sonstiges:0,turnier:0,load:0};
    for(const e of S.entries) if(e.done&&e.date>=ws&&e.date<=we){ w[e.type]+=e.minutes||0; w.load+=(e.minutes||0)*(e.rpe||0); }
    for(const x of S.tournaments) for(const g of x.games){ const d=g.date||x.from; if(d>=ws&&d<=we) w.turnier+=g.minutes||0; }
    weeks.push(w); }
  // Übungsfortschritt
  const used=[...new Set(S.entries.filter(e=>e.type==='kraft').flatMap(e=>e.items.filter(i=>i.sets.some(s=>s.done)).map(i=>i.exId)))].map(exById).filter(Boolean);
  if(!used.find(x=>x.id===UI.statEx)) UI.statEx=used[0]?used[0].id:'';
  const ex=exById(UI.statEx); let prog='';
  if(ex){ const pts=[]; let best=null;
    for(const e of S.entries.filter(e=>e.type==='kraft').sort(byDate)) for(const it of e.items) if(it.exId===ex.id){ const ds=it.sets.filter(s=>s.done); if(!ds.length) continue;
      const m=it.mode; const v = m==='wr'?Math.max(...ds.map(s=>s.w||0)) : m==='r'?Math.max(...ds.map(s=>s.r||0)) : Math.max(...ds.map(s=>s.t||0));
      const vol = m==='wr'?sum(ds,s=>(s.w||0)*(s.r||0)):sum(ds,s=>m==='r'?s.r:s.t);
      const e1 = m==='wr'?Math.max(...ds.map(s=>epley(s.w||0,s.r||0))):null;
      pts.push({label:fshort(e.date),y:v,vol,e1}); if(e1&&(!best||e1>best)) best=e1; }
    const unit=ex.mode==='wr'?'kg':ex.mode==='r'?'Wdh.':'s';
    prog=`${lineChart(pts,unit)}<div class="grid g3" style="margin-top:10px"><div class="kpi"><b>${pts.length?fnum(Math.max(...pts.map(p=>p.y))):'–'} <small>${unit}</small></b><span>Bestwert</span></div><div class="kpi"><b>${best?fnum(Math.round(best*10)/10)+' kg':'–'}</b><span>geschätztes 1RM</span></div><div class="kpi"><b>${pts.length?fnum(pts[pts.length-1].vol):'–'}</b><span>Volumen zuletzt</span></div></div>`; }
  const tot=playerTotals(T); const R=T.reduce((a,x)=>{const r=record(x); a.w+=r.w;a.d+=r.d;a.l+=r.l;a.gf+=r.gf;a.ga+=r.ga; return a;},{w:0,d:0,l:0,gf:0,ga:0});
  const me=tot.find(p=>p.me);
  return `<h1 style="margin-bottom:12px">Statistik</h1>
   <div class="seg">${[['4w','4 Wochen'],['12w','12 Wochen'],['jahr','Jahr'],['alle','Gesamt']].map(([k,l])=>`<button class="${UI.range===k?'on':''}" data-a="range" data-v="${k}">${l}</button>`).join('')}</div>
   <div class="grid g4" style="margin-top:12px"><div class="kpi"><b>${E.length}</b><span>Einheiten</span></div><div class="kpi"><b>${fnum(Math.round(mins/6)/10)} h</b><span>Trainings- & Spielzeit</span></div><div class="kpi"><b>${rp.length?fnum(Math.round(sum(rp,e=>e.rpe)/rp.length*10)/10):'–'}</b><span>Ø Anstrengung</span></div><div class="kpi"><b>${games.length}</b><span>Turnierspiele</span></div></div>
   <div class="grid g4" style="margin-top:10px">${['wasser','kraft','sonstiges'].map(k=>{const x=E.filter(e=>e.type===k); return `<div class="kpi t-${k}"><b style="color:var(--c)">${x.length}×</b><span>${TYPES[k].short} · ${fmin(sum(x,e=>e.minutes))}</span></div>`;}).join('')}<div class="kpi"><b>${fnum(Math.round(sum(E,e=>e.g&&e.g.dist)*10)/10)} km</b><span>Distanz (Garmin)</span></div></div>
   <div class="sec"><h2>Minuten pro Woche</h2></div><div class="card">${barChart(weeks)}<div class="legend">${Object.keys(TYPES).map(k=>`<span class="t-${k}"><i></i>${TYPES[k].short}</span>`).join('')}</div></div>
   <div class="sec"><h2>Belastung pro Woche (Minuten × RPE)</h2></div><div class="card">${lineChart(weeks.map(w=>({label:w.label,y:w.load})),'')}</div>
   <div class="sec"><h2>Kraft-Fortschritt</h2></div>
   <div class="card">${used.length?`<select data-in="statEx">${used.map(x=>`<option value="${x.id}" ${x.id===UI.statEx?'selected':''}>${esc(x.name)}</option>`).join('')}</select><div style="margin-top:10px">${prog}</div>`:`<div class="muted small">Sobald du Sätze im Krafttraining abhakst, siehst du hier deinen Verlauf je Übung.</div>`}</div>
   <div class="sec"><h2>Turniere</h2></div>
   ${games.length?`<div class="grid g4"><div class="kpi"><b>${R.w}-${R.d}-${R.l}</b><span>Siege-Unent.-Niederl.</span></div><div class="kpi"><b>${R.gf}:${R.ga}</b><span>Tore</span></div><div class="kpi"><b>${me?me.tore:'–'}</b><span>Meine Tore</span></div><div class="kpi"><b>${me&&me.wuerfe?Math.round(me.tore/me.wuerfe*100)+' %':'–'}</b><span>Meine Wurfquote</span></div></div><div style="margin-top:10px">${statTable(tot)}</div>`:`<div class="empty">Noch keine Turnierspiele im Zeitraum.</div>`}`;
},

};
const byDate=(a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||''));
const notFound=()=>`<div class="empty">Eintrag nicht gefunden. <a href="#/heute"><u>Zur Übersicht</u></a></div>`;
const rpeText=n=>['','sehr leicht','leicht','locker','moderat','etwas anstrengend','anstrengend','hart','sehr hart','extrem hart','maximal'][n];

function exCard(e,it,i){
  const p=`entries/${e.id}/items/${it.id}`; const lp=lastPerf(it.exId,e); const ex=exById(it.exId); const tg=it.target||{};
  const all=it.sets.length&&it.sets.every(s=>s.done);
  const phW = tg.weight ?? (tg.pct&&ex&&ex.orm?pctWeight(ex.orm,tg.pct):null);
  const prev=e.items[i-1]; const hd=it.block&&(!prev||prev.block!==it.block)?`<div class="blockhd">${esc(it.block)}</div>`:'';
  return hd+`<div class="ex ${all?'done':''}"><div class="row"><span class="num">${all?ic('check','sm'):i+1}</span><div class="grow"><b>${esc(it.name)}</b><div class="tiny muted">${esc(ftarget(it))}</div></div>
     <button class="iconbtn sm" data-a="delExItem" data-id="${e.id}" data-i="${i}">${ic('x','sm')}</button></div>
   ${tg.note?`<div class="hint">${esc(tg.note)}</div>`:''}
   ${lp?`<div class="tiny muted" style="margin-top:4px">Letztes Mal (${fshort(lp.date)}): ${lp.sets.map(s=>fset(s,it.mode)).join(' | ')}</div>`:''}
   ${it.sets.map((s,j)=>{ const l=lp&&(lp.sets[j]||lp.sets[lp.sets.length-1])||{}; const q=`${p}/sets/${j}`;
     const f=(k,unit,ph)=>`<div class="unit"><input data-bind="${q}/${k}" data-num inputmode="decimal" value="${esc(fnum(s[k]))}" placeholder="${esc(fnum(ph))}"><span>${unit}</span></div>`;
     return `<div class="set ${it.mode==='wr'?'':'one'}"><span class="n">${j+1}</span>${it.mode==='wr'?f('w','kg',phW??l.w)+f('r','Wdh',tg.reps??l.r):it.mode==='r'?f('r','Wdh',tg.reps??l.r):f('t','Sek',tg.time??l.t)}
       <button class="chk ${s.done?'on':''}" data-a="setDone" data-id="${e.id}" data-it="${it.id}" data-j="${j}" aria-label="Satz erledigt">${ic('check')}</button></div>`; }).join('')}
   <div class="row" style="margin-top:8px"><button class="btn sm ghost" data-a="addSet" data-id="${e.id}" data-it="${it.id}">+ Satz</button>${it.sets.length>1?`<button class="btn sm ghost" data-a="rmSet" data-id="${e.id}" data-it="${it.id}">− Satz</button>`:''}</div></div>`;
}
function playerTotals(ts){
  const m=new Map();
  for(const t of ts) for(const pl of t.players){ const key=(pl.name||'').trim().toLowerCase()||pl.id; let o=m.get(key); if(!o){ o={name:pl.name,nr:pl.nr,me:!!pl.me,sp:0}; STATS.forEach(([k])=>o[k]=0); m.set(key,o); }
    if(pl.me) o.me=true;
    for(const g of t.games){ const s=g.stats[pl.id]; if(!s||!Object.values(s).some(v=>v)) continue; o.sp++; STATS.forEach(([k])=>o[k]+=s[k]||0); } }
  return [...m.values()].sort((a,b)=>b.tore-a.tore);
}
function statTable(tot){
  return `<div class="tablewrap"><table><tr><th>Spieler</th><th>Sp</th><th>Tore</th><th>Würfe</th><th>Quote</th><th>Ass.</th><th>BG</th><th>BV</th><th>Par.</th><th>G/G/R</th></tr>

/* ---- Diagramme (SVG) ---- */
function barChart(weeks){
  const W=340,H=150,L=26,B=18,keys=['wasser','kraft','sonstiges','turnier'];
  const max=Math.max(60,...weeks.map(w=>sum(keys,k=>w[k]))); const top=Math.ceil(max/60)*60;
  const bw=(W-L)/weeks.length; let h='';
  for(const v of [0,top/2,top]){ const y=H-B-(H-B-8)*v/top; h+=`<line x1="${L}" x2="${W}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${L-4}" y="${y+3}" text-anchor="end">${v}</text>`; }
  weeks.forEach((w,i)=>{ let y=H-B; const x=L+i*bw+bw*.18;
    keys.forEach(k=>{ const hh=(H-B-8)*w[k]/top; if(hh>0){ y-=hh; h+=`<rect x="${x}" y="${y}" width="${bw*.64}" height="${hh}" rx="2" fill="var(--${k})"><title>${TYPES[k].short}: ${w[k]} min (Woche ab ${w.label})</title></rect>`; } });
    if(weeks.length<=6||i%2===(weeks.length-1)%2) h+=`<text x="${x+bw*.32}" y="${H-5}" text-anchor="middle">${w.label}</text>`; });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Minuten pro Woche">${h}</svg>`;
}
function lineChart(pts,unit){
  if(!pts.length) return `<div class="muted small">Noch keine Daten.</div>`;
  const W=340,H=140,L=30,B=18; const max=Math.max(1,...pts.map(p=>p.y)), min=Math.min(...pts.map(p=>p.y)); const lo=min===max?0:Math.max(0,min-(max-min)*.25), hi=max+(max-lo)*.1||1;
  const X=i=>pts.length===1?(L+W)/2:L+8+(W-L-16)*i/(pts.length-1), Y=v=>H-B-(H-B-10)*(v-lo)/(hi-lo);
  let h='';
  for(const v of [lo,(lo+hi)/2,hi]) h+=`<line x1="${L}" x2="${W}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${L-4}" y="${Y(v)+3}" text-anchor="end">${Math.round(v)}</text>`;
  h+=`<polyline fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round" points="${pts.map((p,i)=>X(i)+','+Y(p.y)).join(' ')}"/>`;
  const step=Math.ceil(pts.length/6);
  pts.forEach((p,i)=>{ h+=`<circle cx="${X(i)}" cy="${Y(p.y)}" r="3.2" fill="var(--accent)"><title>${p.label}: ${fnum(p.y)} ${unit}</title></circle>`; if(i%step===0||i===pts.length-1&&pts.length<7) h+=`<text x="${X(i)}" y="${H-5}" text-anchor="middle">${p.label}</text>`; });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${h}</svg>`;
}

/* ---- Pausen-Timer ---- */
const Rest={end:0,iv:null};
function startRest(sec){ if(!sec) return; Rest.end=Date.now()+sec*1000; clearInterval(Rest.iv); Rest.iv=setInterval(tickRest,250); tickRest(); }
function stopRest(){ clearInterval(Rest.iv); $('#rest').classList.remove('on'); }
function tickRest(){
  const left=Math.ceil((Rest.end-Date.now())/1000);
  if(left<=0){ stopRest(); if(navigator.vibrate) navigator.vibrate([200,100,200]); beep(); toast('Pause vorbei, weiter geht’s'); return; }
  $('#rest').classList.add('on'); $('#restt').textContent='Pause '+mmss(left);
}
let AC; function beep(f=880,d=.35){ try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume(); const o=AC.createOscillator(), g=AC.createGain(); o.connect(g); g.connect(AC.destination); o.frequency.value=f; g.gain.value=.2; o.start(); o.stop(AC.currentTime+d); }catch(e){} }

/* ---- Feedback an den Trainer ---- */
const L={
 de:{fb:'Feedback',dur:'Dauer',rpe:'Anstrengung (RPE)',ex:'Übungen',notes:'Notizen',my:'Mein Feedback',week:'Wochenbericht',sessions:'Einheiten',total:'Gesamtzeit',dist:'Distanz',hr:'Ø Puls',types:{wasser:'Wassertraining',kraft:'Krafttraining',sonstiges:'Sonstiges'},hi:'Hallo',tags:'Inhalte',plan:'Plan'},
 en:{fb:'Feedback',dur:'Duration',rpe:'Effort (RPE)',ex:'Exercises',notes:'Notes',my:'My feedback',week:'Weekly report',sessions:'Sessions',total:'Total time',dist:'Distance',hr:'Avg HR',types:{wasser:'Boat session',kraft:'Strength training',sonstiges:'Other training'},hi:'Hi',tags:'Content',plan:'Plan'},
 fr:{fb:'Retour',dur:'Durée',rpe:'Effort perçu (RPE)',ex:'Exercices',notes:'Notes',my:'Mon retour',week:'Bilan de la semaine',sessions:'Séances',total:'Temps total',dist:'Distance',hr:'FC moy.',types:{wasser:'Séance bateau',kraft:'Musculation',sonstiges:'Autre entraînement'},hi:'Salut',tags:'Contenu',plan:'Plan'}};
const ldate=(d,lang)=>pdate(d).toLocaleDateString({de:'de-DE',en:'en-GB',fr:'fr-FR'}[lang]||'en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
function fbText(e,lang,brief){
  const l=L[lang]||L.en, a=[];
  a.push(`${brief?'•':l.fb+' –'} ${l.types[e.type]}${e.title&&e.title!==TYPES[e.type].label?' “'+e.title+'”':''} (${ldate(e.date,lang)})`);
  const m=[]; if(e.minutes) m.push(`${l.dur}: ${e.minutes} min`); if(e.rpe) m.push(`${l.rpe}: ${e.rpe}/10`); if(e.g&&e.g.dist) m.push(`${l.dist}: ${fnum(e.g.dist)} km`); if(e.g&&e.g.hr) m.push(`${l.hr}: ${e.g.hr}`);
  if(m.length) a.push((brief?'  ':'')+m.join(' · '));
  if(e.tags&&e.tags.length) a.push((brief?'  ':'')+l.tags+': '+e.tags.join(', '));
  const its=e.items.filter(i=>i.sets.some(s=>s.done));
  if(its.length){ if(!brief) a.push('',l.ex+':'); for(const it of its) a.push((brief?'  – ':'• ')+it.name+': '+it.sets.filter(s=>s.done).map(s=>fset(s,it.mode).replace(' Wdh.','')).join(' | ')); }
  if(e.notes){ if(!brief) a.push(''); a.push((brief?'  ':'')+l.notes+': '+e.notes); }
  if(e.feedback){ if(!brief) a.push(''); a.push((brief?'  ':'')+l.my+': '+e.feedback); }
  return a.join('\n');
}
function weekText(lang){
  const l=L[lang]||L.en, t=today(), from=addDays(t,-6);
  const E=S.entries.filter(e=>e.done&&e.date>=from&&e.date<=t).sort(byDate);
  const rp=E.filter(e=>e.rpe);
  return `${l.hi} ${S.settings.trainer||''},\n${l.week} ${fshort(from)}–${fshort(t)}\n${l.sessions}: ${E.length} · ${l.total}: ${fmin(sum(E,e=>e.minutes))}${rp.length?' · Ø RPE '+fnum(Math.round(sum(rp,e=>e.rpe)/rp.length*10)/10):''}\n\n`+E.map(e=>fbText(e,lang,true)).join('\n\n');
}

/* ---- Garmin-Import ---- */
function parseCSV(text){
  const delim=(text.split('\n')[0].match(/;/g)||[]).length>(text.split('\n')[0].match(/,/g)||[]).length?';':',';
  const rows=[]; let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){ const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else if(c==='"') q=true; else if(c===delim){ row.push(cur); cur=''; } else if(c==='\n'){ row.push(cur); rows.push(row); row=[]; cur=''; } else if(c!=='\r') cur+=c; }
  if(cur||row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r=>r.some(x=>x.trim()));
}

    for(let i=1;i<pts.length;i++){ const a=pts[i-1],b=pts[i]; const la1=rad(+a.getAttribute('lat')),la2=rad(+b.getAttribute('lat')),dl=rad(+b.getAttribute('lon')-+a.getAttribute('lon')); const h=Math.sin((la2-la1)/2)**2+Math.cos(la1)*Math.cos(la2)*Math.sin(dl/2)**2; dist+=2*R*Math.asin(Math.sqrt(h)); }

const TR={t:null,seq:[],i:0,end:0,left:0,paused:false,iv:null,lastS:null,entryId:null,lock:null,done:false};
function runTimer(t,entryId){
  const seq=buildSeq(t); if(!seq.length) return toast('Der Timer hat noch keine Übung mit Belastungszeit');
  Object.assign(TR,{t,seq,entryId:entryId||null,paused:false,done:false,total:sum(seq,x=>x.dur)});
  $('#sheet').classList.remove('on'); beep(1,.01);
  try{ navigator.wakeLock&&navigator.wakeLock.request('screen').then(l=>TR.lock=l).catch(()=>{}); }catch(e){}

function trGo(i,sound){

  if(sound){ beep(ph.k==='work'?990:520,.5); if(navigator.vibrate) navigator.vibrate(ph.k==='work'?[300]:[120,80,120]); }
  trDraw();
}
function trTick(){
  if(TR.paused||TR.done) return; TR.left=TR.end-Date.now();

  $('#rnext').textContent=nx?`Danach: ${nx.label} (${nx.dur>=60?mmss(nx.dur)+' min':nx.dur+' s'})`:'Letzter Abschnitt';

  $('#run').className='on prep'; $('#rphase').textContent='Geschafft'; $('#rtime').textContent=mmss(TR.total); $('#rinfo').textContent=TR.t.name; $('#rbar').style.setProperty('--p',1);

 saveGuide(){ const v=formVals($('#sheet')); let g=S.guides.find(x=>x.id===v.id); if(!g){ g={id:uid()}; S.guides.push(g); } const {id,...rest}=v; Object.assign(g,rest); if(!g.title) g.title='Woche ab '+fshort(g.from); save(); closeSheet(); },
 delGuide(el){ S.guides=S.guides.filter(g=>g.id!==el.dataset.id); save(); closeSheet(); },
 // Feedback
 sendFeedback(el){ const e=entry(el.dataset.id); shareSheet('Feedback an '+(S.settings.trainer||'Trainer'),fbText(e,S.settings.lang),{kind:'entry',id:e.id}); },
 weekReport(){ shareSheet('Wochenbericht',weekText(S.settings.lang),{kind:'week'}); },
 fbLang(el){ S.settings.lang=el.dataset.v; save(); const c=UI.share; c.kind==='week'?A.weekReport():A.sendFeedback({dataset:{id:c.id}}); },
 shCopy(){ copyText($('#sharetxt').value); },
 shNative(){ const text=$('#sharetxt').value; navigator.share?navigator.share({text}).catch(()=>{}):copyText(text); },
 shWa(){ window.open('https://wa.me/'+(S.settings.trainerPhone||'').replace(/\D/g,'')+'?text='+encodeURIComponent($('#sharetxt').value),'_blank'); },
 shMail(){ location.href='mailto:'+encodeURIComponent(S.settings.trainerMail||'')+'?subject='+encodeURIComponent('Training – Feedback '+(S.settings.name||''))+'&body='+encodeURIComponent($('#sharetxt').value); },
 // Turniere
 newTourn(){ tournSheet(); },
 tkind(el){ tourn(el.dataset.id).kind=el.dataset.v; save(); render(); },
 delTourn(el){ if(!confirm('Turnier mit allen Spielen löschen?')) return; S.tournaments=S.tournaments.filter(t=>t.id!==el.dataset.id); save(); go('#/turniere'); },
 addPlayer(el){ tourn(el.dataset.id).players.push({id:uid(),name:'',nr:null,me:false}); save(); render(); const ins=$$('#view input[data-bind$="/name"]'); const last=ins[ins.length-1]; last&&last.focus(); },
 delPlayer(el){ const t=tourn(el.dataset.id); t.players=t.players.filter(p=>p.id!==el.dataset.p); save(); render(); },
 mePlayer(el){ tourn(el.dataset.id).players.forEach(p=>p.me=p.id===el.dataset.p?!p.me:false); save(); render(); },
 copyRoster(el){ const t=tourn(el.dataset.id); const src=[...S.tournaments].filter(x=>x.id!==t.id&&x.players.length).sort((a,b)=>b.from.localeCompare(a.from)).find(x=>x.from<=t.from)||S.tournaments.find(x=>x.players.length); if(!src) return toast('Kein Turnier mit Kader gefunden'); t.players=src.players.map(p=>({...p,id:uid()})); save(); render(); },
 newGame(el){ const t=tourn(el.dataset.id); const d=today()>=t.from&&today()<=(t.to||t.from)?today():t.from; const g={id:uid(),opp:'',phase:'',date:d,time:'',minutes:20,gf:null,ga:null,notes:'',rating:null,stats:{}}; t.games.push(g); save(); go(`#/spiel/${t.id}/${g.id}`); },
 delGame(el){ if(!confirm('Spiel löschen?')) return; const t=tourn(el.dataset.t); t.games=t.games.filter(g=>g.id!==el.dataset.g); save(); go('#/turnier/'+t.id); },
 score(el){ const g=tourn(el.dataset.t).games.find(x=>x.id===el.dataset.g); g[el.dataset.k]=Math.max(0,(g[el.dataset.k]||0)+ +el.dataset.d); save(); render(); },
 syncScore(el){ const t=tourn(el.dataset.t), g=t.games.find(x=>x.id===el.dataset.g); g.gf=sum(t.players,p=>(g.stats[p.id]||{}).tore); save(); render(); },
 pstat(el){ const g=tourn(el.dataset.t).games.find(x=>x.id===el.dataset.g), k=el.dataset.k, d=+el.dataset.d; const s=g.stats[el.dataset.p]=g.stats[el.dataset.p]||{};
  const old=s[k]||0; s[k]=Math.max(0,old+d); const real=s[k]-old;
  if(k==='tore'&&real){ s.wuerfe=Math.max(s.tore,(s.wuerfe||0)+real); g.gf=Math.max(0,(g.gf||0)+real); }
  if(k==='wuerfe'&&s.wuerfe<(s.tore||0)) s.wuerfe=s.tore;
  save(); render(); },
 togglePlayer(el){ const id=el.dataset.p; const cur=UI.openPlayers[id]; const t=tourn(route()[1]); const pl=t.players.find(p=>p.id===id); UI.openPlayers[id]=!(cur??!!pl.me); render(); },
 rating(el){ const g=tourn(el.dataset.t).games.find(x=>x.id===el.dataset.g); g.rating=g.rating===+el.dataset.v?null:+el.dataset.v; save(); render(); },
 // PDF
 pdfEntry(el){ const e=entry(el.dataset.id); printDoc(e.title||TYPES[e.type].label,entryPrint(e)); },
 pdfPlan(el){ const p=planById(el.dataset.id); let last=null; printDoc(p.name,`${p.note?`<p>${esc(p.note)}</p>`:''}<table><tr><th>#</th><th style="text-align:left">Übung</th><th style="text-align:left">Vorgabe</th><th style="text-align:left">Hinweis</th><th>Notiz / Gewicht</th></tr>${p.items.map((it,i)=>{ const hd=it.block&&it.block!==last?`<tr><td colspan="5"><b>${esc(it.block)}</b></td></tr>`:''; last=it.block; return hd+`<tr><td>${i+1}</td><td style="text-align:left">${esc(it.name)}</td><td style="text-align:left">${esc(ftarget(it))}</td><td style="text-align:left">${esc(it.note)}</td><td style="min-width:90pt"></td></tr>`; }).join('')}</table>`); },
 pdfTourn(el){ const t=tourn(el.dataset.id); printDoc(t.name||'Turnier',tournPrint(t)); },
 pdfSeason(){ const rows=[...S.entries.map(e=>({d:e.date,h:`<tr><td>${fdate(e.date)} ${esc(e.time||'')}</td><td style="text-align:left">${TYPES[e.type].short}</td><td style="text-align:left">${esc(e.title)}</td><td>${e.minutes||e.planned||''}</td><td>${e.rpe||''}</td><td>${e.done?'✓':''}</td></tr>`})),
   ...S.tournaments.map(t=>({d:t.from,h:`<tr><td>${fdate(t.from)}${t.to&&t.to!==t.from?' – '+fshort(t.to):''}</td><td style="text-align:left"><b>${t.kind==='lehrgang'?'Lehrgang':'Turnier'}</b></td><td style="text-align:left"><b>${esc(t.name)}</b>${t.ort?' · '+esc(t.ort):''}${t.team?' · '+esc(t.team):''}</td><td></td><td></td><td>${esc(t.platz||'')}</td></tr>`}))].sort((a,b)=>a.d.localeCompare(b.d));
  let h='',mo=''; for(const r of rows){ const m=r.d.slice(0,7); if(m!==mo){ if(mo) h+='</table>'; mo=m; h+=`<h2>${MON[+m.slice(5)-1]} ${m.slice(0,4)}</h2><table><tr><th>Datum</th><th style="text-align:left">Art</th><th style="text-align:left">Inhalt</th><th>min</th><th>RPE</th><th>✓</th></tr>`; } h+=r.h; }
  printDoc('Saisonübersicht '+(S.settings.name||''),h?h+'</table>':'<p>Noch keine Einträge.</p>'); },
 pdfStats(){ const E=S.entries.filter(e=>e.done).sort(byDate); printDoc('Trainingstagebuch '+(S.settings.name||''),`<p class="meta">${E.length} Einheiten · ${fmin(sum(E,e=>e.minutes))}</p>`+E.map(e=>`<div class="nb"><h2>${esc(e.title)}</h2>${entryPrint(e).replace(/<h2>/g,'<p><b>').replace(/<\/h2>/g,'</b></p>')}</div>`).join('')); },
 // Daten
 backup(){ download('PoloLog_Backup_'+today()+'.json',JSON.stringify(S)); toast('Backup exportiert'); },
 reset(){ if(!confirm('Wirklich ALLE Daten löschen und auf den Startzustand zurücksetzen?')) return; if(!confirm('Sicher? Das kann nicht rückgängig gemacht werden.')) return; S=freshState(); save(); applyTheme(); go('#/heute'); },
 garminImport(){ const v=formVals($('#sheet')); let n=0; UI.garmin.forEach((a,i)=>{ if(!$(`[name=g${i}]`).checked) return; const type=v['t'+i]; const g={dist:a.dist||null,hr:a.hr,maxhr:a.maxhr,kcal:a.kcal,src:'garmin',key:gkey(a)};
   let e=S.entries.find(x=>x.date===a.date&&x.type===type&&!(x.g&&x.g.key)); if(e){ if(!e.minutes) e.minutes=a.minutes; if(!e.time) e.time=a.time; e.g=g; e.done=true; } else S.entries.push(newEntry({type,date:a.date,time:a.time,title:a.title,minutes:a.minutes,done:true,g}));
   n++; }); save(); closeSheet(); toast(n+' Aktivitäten importiert'); },
 restAdd(){ Rest.end+=30000; tickRest(); }, restStop(){ stopRest(); }
};
function applyTheme(){ document.documentElement.dataset.theme=S.settings.theme==='light'?'light':'dark'; const m=$('meta[name=theme-color]'); if(m) m.content=S.settings.theme==='light'?'#faf6f3':'#171210'; }

/* ---- Ereignisse ---- */
document.addEventListener('click',ev=>{
  if(ev.target.id==='sheet') return closeSheet();
  const el=ev.target.closest('[data-a]'); if(!el) return;
  const fn=A[el.dataset.a]; if(fn){ if(el.tagName!=='A') ev.preventDefault(); fn(el,ev); }
});
let saveT;
document.addEventListener('input',ev=>{
  const el=ev.target;
  if(el.dataset.in==='exq'){ UI.exq=el.value; return filterEx($('#exlist'),el.value); }
  if(el.dataset.in==='pickq') return filterEx($('#picklist'),el.value);
  if(el.dataset.in==='statEx'){ UI.statEx=el.value; return render(); }
  if(!el.dataset.bind) return;
  const r=ref(el.dataset.bind); if(!r) return;
  r[0][r[1]] = 'num' in el.dataset ? num(el.value) : el.value;
  clearTimeout(saveT); saveT=setTimeout(save,250);
});
document.addEventListener('change',ev=>{
  const el=ev.target;
  if(el.dataset.bind){ clearTimeout(saveT); save(); if('rr' in el.dataset) render(); }
  if(el.dataset.file) readFiles(el);
});
window.addEventListener('pagehide',()=>{ clearTimeout(saveT); save(); });
document.addEventListener('visibilitychange',()=>{ if(document.hidden){ clearTimeout(saveT); save(); } });
async function readFiles(el){
  const kind=el.dataset.file, files=[...el.files]; el.value=''; if(!files.length) return;
  const texts=await Promise.all(files.map(f=>f.text().then(t=>[f.name,t])));
  try{
    if(kind==='garmin'){ let acts=[]; for(const [n,t] of texts) acts=acts.concat(/\.csv$/i.test(n)||!t.trim().startsWith('<')?garminCSV(t):garminXML(t,n)); if(!acts.length) return toast('Keine Aktivitäten erkannt – bitte CSV, TCX oder GPX aus Garmin Connect wählen'); garminSheet(acts); }
    else if(kind==='backup'){ const d=JSON.parse(texts[0][1]); if(!d||!Array.isArray(d.entries)||!Array.isArray(d.exercises)) throw 0; if(!confirm('Aktuelle Daten durch das Backup ersetzen?')) return; S=d; migrate(); save(); applyTheme(); toast('Backup eingespielt'); go('#/heute'); }
    else if(kind==='plan'){ const d=JSON.parse(texts[0][1]); const p=d.plan; if(!p||!Array.isArray(p.items)) throw 0; p.id=uid();
      p.items.forEach(it=>{ it.id=uid(); let ex=S.exercises.find(e=>e.name.toLowerCase()===String(it.name).toLowerCase()); if(!ex){ ex={id:'c-'+uid(),name:it.name,cat:'Importiert',mode:it.mode||'wr',note:'',orm:null,custom:true}; S.exercises.push(ex); } it.exId=ex.id; });
      S.plans.push(p); save(); $('#sheet').classList.remove('on'); toast('Plan importiert'); go('#/plan/'+p.id); }
  }catch(e){ toast('Datei konnte nicht gelesen werden'); }
}
window.addEventListener('hashchange',()=>{ if($('#sheet').classList.contains('on')){ $('#sheet').classList.remove('on'); $('#sheet').innerHTML=''; } render(); });
window.addEventListener('afterprint',()=>{ $('#print').innerHTML=''; });
load(); applyTheme(); buildNav(); render();

</script>
